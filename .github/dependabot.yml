version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns:
          - "ruff*"
          - "mypy*"
          - "ty*"
          - "pyrefly*"
          - "types-requests*"
          - "zizmor*"
      main:
        patterns:
          - "*"
